name: NSE Telegram Intraday Alerts

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes in the NSE cash session (IST, Monday-Friday).
    - cron: "0,30 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nse-telegram-intraday-alerts
  cancel-in-progress: false

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Scan NSE and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_intraday_alerts.py
      - name: Save alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/telegram-alert-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram alert state"
            git push
          fi
