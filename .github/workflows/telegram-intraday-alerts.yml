
name: NSE Telegram Intraday Alerts

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Send a test message only (no market scan)'
        required: true
        type: boolean
        default: false

      send_daily_report:
        description: 'Send the market report to Telegram now'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nse-telegram-intraday-alerts
  cancel-in-progress: false

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan NSE and send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST_URL: ${{ secrets.WATCHLIST_URL }}
          WATCHLIST_ACCESS_KEY: ${{ secrets.WATCHLIST_ACCESS_KEY }}
          TELEGRAM_TEST_ONLY: ${{ inputs.test_telegram && 'true' || 'false' }}
          TELEGRAM_TRIAL_SCAN: ${{ github.event_name == 'workflow_dispatch' }}
          TELEGRAM_SEND_DAILY_REPORT: ${{ inputs.send_daily_report && 'true' || 'false' }}
        run: python scripts/telegram_intraday_alerts.py

      - name: Save alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f state/telegram-alert-state.json ]; then
            git add state/telegram-alert-state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Telegram alert state"
              git push
            fi
          else
            echo "No alert state file created; nothing to save."
          fi
